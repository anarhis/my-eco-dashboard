name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Обновили версию Node.js, чтобы убрать предупреждение о депрекации

      # Используем npm install вместо npm ci, так как у нас в репозитории нет lock-файла
      - name: Install Dependencies 📦
        run: npm install

      - name: Build Project 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Папка, куда Vite собирает готовый проект
          branch: gh-pages # Ветка, куда полетит готовый рабочий сайт
